services:
  shukatsu-agent:
    build: .
    container_name: shukatsu-agent
    ports:
      - "127.0.0.1:5001:5000"  # Keep the unauthenticated UI local-only
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env  # Settings UI persists local configuration here
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0  # Listen on the container interface; host exposure stays local above
    restart: unless-stopped
